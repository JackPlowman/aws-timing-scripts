name: Clean Caches

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  clean-caches:
    name: Clean Caches
    runs-on: ubuntu-latest
    permissions:
      actions: write # Required to delete repository caches
    steps:
      - name: Delete caches
        run: gh cache delete --all --repo "$GITHUB_REPOSITORY" --succeed-on-no-caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
